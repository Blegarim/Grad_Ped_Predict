# DataCfg — data-layer constants (B7 magic constants relocated here).
max_seq_len: 20
# CONSUMED motion channels (model input width). The v2 writer always stores 9 (8 bbox channels +
# ego-speed, MOTION_STORE_DIM); the dataset slices to this at read time. 8 = no ego, 9 = with ego.
motion_dim: 8            # must equal model.motion_dim (validated)
source_width: 1920       # PIE source-frame pixel dims; used by flip cx-reflection (A4) and
source_height: 1080      # cross-checked against model.motion_norm_image_size
img_height: 128
img_width: 128
read_context_height: 224  # read-time context model input (OLD train.py); write-time context is img*context_scale=384
read_context_width: 224
context_scale: 3.0       # context crop = scale * tight bbox (uniform 3.0; override for ablation)
jpeg_quality: 90
chunk_size: 5000
# LMDB map_size (compute_map_size). C3: Windows PRE-ALLOCATES the file at map_size, and the legacy
# heuristic reserved ~3x the real payload (~2-3 GB JPEG per 5000-sample chunk) — explicit 4 GiB
# keeps ~30%+ headroom. A too-small value fails LOUDLY (lmdb.MapFullError); null -> heuristic.
lmdb_map_size_bytes: 4294967296
lmdb_map_size_floor_gib: 4.0
lmdb_map_size_safety: 1.5
# offline writer DataLoader parallelism (preprocessing only)
preprocess_num_workers: 8
preprocess_prefetch_factor: 2
seq_len: 20
stride: 3
future_offset: 30
tol: 2
# M4 refinement — see DataCfg.emit_determined_positives. The censor filter asks only "was the full
# future observed?", so it also bins windows where the crossing was plainly SEEN inside the truncated
# remainder — confirmed positives, in a task with ~2.9% of them. true keeps those (label never in
# doubt); windows with no observed crossing and a truncated future are still dropped either way.
# CHANGES THE WINDOW POPULATION — flipping it needs a regen + a Dataset Statistics re-pin.
emit_determined_positives: false
# M5 benchmark-protocol eval set (test split only): fixed-TTE windows before the PIE crossing_point,
# labeled by the crossing EVENT (Kotseruba et al. WACV 2021 protocol). stride = obs_len*(1-overlap).
benchmark_obs_len: 20
benchmark_tte_min: 30
benchmark_tte_max: 60
benchmark_overlap: 0.7
# S1 pivot — LMDB set for train/eval (the cross-protocol-matrix switch): "streaming" (standard ~37:1
# v2 windows) | "anchored" (Kotseruba benchmark ~2.5:1). Does not change how windows are generated.
protocol: streaming
# PIE source opts (generate_data_trajectory_sequence) — mirror the OLD data_opts literals.
# ⚠️ Under seq_type=all, PIE's `_get_all` reads ONLY `data_split_type` and `seq_type`. It applies no
# min_track_size, no fstride, no height_rng and no squarify_ratio — it returns every behaviour-annotated
# pedestrian track at full length (verified 2026-08-20 against PIE/utilities/pie_data.py). The four fields
# below are therefore INERT on the standard path. Harmless at these values (fstride 1 = no skip,
# squarify 0 = off, height unbounded, and window_track's `n < seq_len` drop substitutes for
# min_track_size) — but changing one to filter an ablation will silently do NOTHING. Filter in
# window_track / the LMDB writer instead, and re-pin the stats table when you do.
min_track_size: 10       # inert (see above)
fstride: 1               # inert (see above)
data_split_type: default
seq_type: all
squarify_ratio: 0.0      # inert (see above)
height_min: 0.0          # inert (see above)
height_max: null         # inert (see above); null -> float('inf')
norm_mean: [0.485, 0.456, 0.406]
norm_std:  [0.229, 0.224, 0.225]
