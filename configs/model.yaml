# ModelCfg. The motion block mirrors OLD config.py (motion_enc_args_config) EXACTLY; the ViT
# stage schedule is the A1 redesign (legacy schedule golden-pinned, not the live default).
d_model: 128
in_channels: 3
motion_dim: 8            # must equal data.motion_dim (validated)
# A4 motion norm (in-forward): image -> fixed per-channel scale, keeps absolute geometry |
# per_sequence -> legacy z-norm, golden-pinned ablation arm
motion_norm: image
motion_norm_image_size: [1920, 1080]   # (W, H); must equal data.source_width/height (validated)
ego_speed_scale: 50.0    # km/h scale for the ego channel under image norm
# A1 redesign: monotonic dims, real 7x7 windows (dim/head = 24 each), last stage global. Was the
# collapsed [36,36,288,36] + 2x2 windows; legacy schedule golden-pinned in tests.
stage_dims: [48, 96, 192, 384]
layer_nums: [2, 2, 6, 2]
head_nums:  [2, 4, 8, 16]
window_size: [7, 7, 7, null]
mlp_ratio:  [4, 4, 4, 4]
drop_path: 0.15
attn_dropout: 0.15
proj_dropout: 0.15
dropout: 0.15
motion_hidden_dim: 168
motion_num_layers: 2
motion_num_heads: 8
motion_dropout: 0.3
head_dropout: 0.1
num_classes: {actions: 2, looks: 2, crosses: 2}
# CrossAttentionModule — mirrors scripts/model_utils.get_model() full-model wiring.
cross_attn_num_heads: 4        # get_model passes num_heads=4 (NOT the class default 8)
use_frame_crosses: true
frame_pool: logsumexp          # {logsumexp, max, mean}
emit_crosses_pooled: true      # B4: live-but-unsupervised auxiliary head (kept ready to swap in)
fusion_residual: true          # A3/RQ2: motion-query residual at fusion (project standard; false = ablation)
