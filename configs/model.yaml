# ModelCfg. The motion block mirrors OLD config.py (motion_enc_args_config) EXACTLY; the ViT
# stage schedule is the A1 redesign (legacy schedule golden-pinned, not the live default).
d_model: 128
in_channels: 3
motion_dim: 8            # must equal data.motion_dim (validated)
# A4 motion norm (in-forward): image -> fixed per-channel scale, keeps absolute geometry |
# per_sequence -> legacy z-norm, golden-pinned ablation arm
motion_norm: image
motion_norm_image_size: [1920, 1080]   # (W, H); must equal data.source_width/height (validated)
ego_speed_scale: 50.0    # km/h scale for the ego channel under image norm
# A1 redesign: monotonic dims, real 7x7 windows (dim/head = 24 each), last stage global. Was the
# collapsed [36,36,288,36] + 2x2 windows; legacy schedule golden-pinned in tests.
stage_dims: [48, 96, 192, 384]
layer_nums: [2, 2, 6, 2]
head_nums:  [2, 4, 8, 16]
window_size: [7, 7, 7, null]
mlp_ratio:  [4, 4, 4, 4]
drop_path: 0.15
attn_dropout: 0.15
proj_dropout: 0.15
dropout: 0.15
# RQ1 visual-backbone swap (docs/BACKBONE_STUDY.md): legacy = from-scratch A1 ViT (golden-pinned
# default) | a timm model name (e.g. tiny_vit_5m_224) = pretrained hierarchical drop-in. The ViT
# stage schedule above only configures legacy; it is inert when a timm backbone is selected.
vit_backbone: legacy
vit_pretrained: true             # load timm ImageNet weights (ignored when vit_backbone=legacy)
# Freeze ONLY the ViT (`vit.*`); train motion+fusion+heads. Field-standard on the small anchored set —
# frozen pretrained features prevent backbone memorizing. NOT ScheduleCfg.freeze_backbone (all-but-heads).
freeze_vit_backbone: false
motion_hidden_dim: 168
motion_num_layers: 2
motion_num_heads: 8
motion_dropout: 0.3
head_dropout: 0.1
num_classes: {actions: 2, looks: 2, crosses: 2}
# CrossAttentionModule — mirrors scripts/model_utils.get_model() full-model wiring.
cross_attn_num_heads: 4        # get_model passes num_heads=4 (NOT the class default 8)
use_frame_crosses: true
frame_pool: logsumexp          # {logsumexp, max, mean}
emit_crosses_pooled: true      # B4: live-but-unsupervised auxiliary head (kept ready to swap in)
fusion_residual: true          # A3/RQ2: motion-query residual at fusion (project standard; false = ablation)

# --- Onset-timing head (docs/METHODOLOGY.md prong 2) -------------------------------------------
# OFF by default: the four pose_full baselines were trained without it, and off means no extra output
# key and no extra parameter, so their checkpoints still load strict=True.
# On, the model also emits `crosses_hazard [B, K]` (one hazard logit per future bin — "given no
# crossing has started yet, does one start in bin k?") and `crosses_readout [B, 2]`, those bins
# collapsed to P(onset within onset_horizon) = 1 - prod(1 - h_k).
onset_head: false
# L: future frames the head covers. MUST exceed onset_horizon — a head only as wide as the reported
# horizon still labels a crossing at H+5 a flat negative, which is the failure the method removes.
onset_lookahead: 60
onset_bin_width: 1             # w: future frames per bin. 1 = per-frame. Raise (4) if the head
                               # collapses to h~0: it multiplies the positives each bin sees, at the
                               # cost of timing resolution. onset_lookahead and onset_horizon must
                               # both divide by it.
onset_horizon: 32              # H: must equal data.future_offset + data.tol (validated)
# Which head `crosses` is SCORED on. false = crosses_frame, identical to the baselines, so the hazard
# head can ride along as a pure auxiliary task without moving a single reported number. true =
# crosses_readout, the pure-reformulation arm. Affects metrics ONLY, never the loss routing.
onset_report_crosses: false
