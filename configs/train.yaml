# TrainCfg — replaces train.py:280-296,346 literals.
lr: 1.0e-4
weight_decay: 1.0e-5
batch_size: 4
accum_steps: 8           # effective batch = batch_size*accum_steps = 32 (tames small-batch grad noise).
                         # NOTE: larger effective batch can take a higher lr (linear-scaling rule); lr kept
                         # conservative at 1e-4 — revisit if convergence is slow.
num_epochs: 30
num_workers: 4
use_amp: true            # request; AND-gated by CUDA availability at runtime
seed: 42                 # global RNG seed (M7); logged via the run-dir config snapshot
selection_metric: macro_f1   # best-ckpt + early-stop scalar (M8): val_loss | macro_f1 | crosses_f1
loss_weight: {actions: 0.8, looks: 0.8, crosses: 1.2}
use_class_weights: false # imbalance lever 3 (M1): inverse-frequency CE class weights — OFF by default (run #2 canonical)
use_weighted_sampler: true
sampler_powers: {crosses: 0.5, actions: 0.3, looks: 0.3}  # tuned down (run #2): ~26% effective crosses vs 2.8% base
sampler_min_weight: 1.0e-6
grad_clip_max_norm: 1.0
early_stop_patience: 20   # wide enough for warmup_cosine to traverse its full curve before stopping
early_stop_min_delta: 0.001
sched_factor: 0.5         # ReduceLROnPlateau knobs (lr_schedule: plateau only)
sched_patience: 2
sched_threshold: 1.0e-4
# LR schedule. Default "warmup_cosine": linear warmup tames the from-scratch ViT's epoch-1 blow-up,
# then cosine glides lr 
lr_schedule: warmup_cosine
warmup_epochs: 1          # gentle first epoch at warmup_start_factor*lr, then peak from epoch 1
warmup_start_factor: 0.1  # first warmup epoch runs at warmup_start_factor * lr (= 1e-5 at lr=1e-4)
lr_min: 1.0e-6            # cosine eta_min (also the ReduceLROnPlateau floor when lr_schedule: plateau)
# chunk prefetch loader — OLD train.py:367-498 literals.
chunk_preload_depth: 3
chunk_warm_ram_threshold: 96.0
chunk_warm_mem_interval: 1.0
chunk_warm_mem_timeout: null     # null preserves the legacy infinite RAM wait
chunk_queue_timeout: 300.0
dataloader_prefetch_factor: 2
